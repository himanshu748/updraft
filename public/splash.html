<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no"
    >
    <title>Updraft</title>
    <link rel="modulepreload" href="splash.js">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="splash">
    <canvas id="map"></canvas>
    <main>
      <div class="plate">
        <div class="brand">✈ Updraft</div>
        <div id="title" class="title">Today's course</div>
        <div class="stats">
          Drag back to throw. Hold to climb. Release to glide.
        </div>
        <div id="stats" class="stats" aria-live="polite"></div>
        <div id="podium" class="podium" hidden></div>
      </div>
      <button id="start-btn" type="button" class="primary big-btn">
        Throw
      </button>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
